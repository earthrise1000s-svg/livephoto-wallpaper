[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livephoto-wallpaper"
version = "1.0.0"
description = "Convert any video into an authentic iOS 17+ Live Photo wallpaper with zero external assets."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "LivePhoto-Wallpaper Contributors" }
]
keywords = ["apple", "livephoto", "wallpaper", "ios17", "avfoundation", "exiftool"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.optional-dependencies]
cli = ["rich>=13.0.0"]

[project.scripts]
livephoto = "livephoto.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["livephoto*"]

[tool.setuptools.package-data]
livephoto = ["synthesize.m"]
